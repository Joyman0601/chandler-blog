  <circle cx="14" cy="94" r="4" fill="#191919"/>
  <text x="30" y="140" font-size="17" font-weight="300" fill="#191919">保存手动选择的处理尚未接入</text>
  <path d="M14 123V145" stroke="#191919" stroke-width="3" fill="none"/>
  <text x="30" y="180" font-size="17" font-weight="300" fill="#191919">目标页读不到选择</text>
  <circle cx="14" cy="174" r="4" fill="#191919"/>
  <text x="30" y="220" font-size="17" font-weight="300" fill="#191919">按默认规则回到原语言</text>
  <circle cx="14" cy="214" r="4" fill="#191919"/>
</svg>
