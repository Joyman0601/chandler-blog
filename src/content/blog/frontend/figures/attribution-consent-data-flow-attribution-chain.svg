<svg xmlns="http://www.w3.org/2000/svg" width="520" height="247" viewBox="0 0 400 190" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>一次来访怎样和后续注册连接起来</title>
  <path d="M14 18V50" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 58V90" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 98V130" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 138V170" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <text x="30" y="20" font-size="17" font-weight="300" fill="#191919">链接带 utm_source=community</text>
  <circle cx="14" cy="14" r="4" fill="#191919"/>
  <text x="30" y="60" font-size="17" font-weight="300" fill="#191919">浏览器获得访客编号 V1</text>
  <circle cx="14" cy="54" r="4" fill="#191919"/>
