<svg xmlns="http://www.w3.org/2000/svg" width="520" height="218" viewBox="0 0 400 168" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>两个网关先后读到同一个名额，执行器领取时只有一个任务成功</title>
  <path d="M14 26V62" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 70V106" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 114V150" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <circle cx="14" cy="22" r="4" fill="#191919"/>
  <text x="30" y="27" font-size="13" fill="#626262">时刻 A</text>
  <text x="83.08" y="28" font-size="17" font-weight="300" fill="#191919">网关甲读到渠道还有一个名额</text>
  <circle cx="14" cy="66" r="4" fill="#191919"/>
  <text x="30" y="71" font-size="13" fill="#626262">时刻 B</text>
  <text x="83.08" y="72" font-size="17" font-weight="300" fill="#191919">网关乙读到同一个名额</text>
  <circle cx="14" cy="110" r="4" fill="#191919"/>
  <text x="30" y="115" font-size="13" fill="#626262">时刻 C</text>
  <text x="83.08" y="116" font-size="17" font-weight="300" fill="#191919">甲、乙分别把任务送入队列</text>
  <circle cx="14" cy="154" r="4" fill="#191919"/>
  <text x="30" y="159" font-size="13" fill="#626262">时刻 D</text>
  <text x="83.08" y="160" font-size="17" font-weight="300" fill="#191919">执行器开始领取，只有一个任务成功</text>
</svg>
