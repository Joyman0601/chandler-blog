<svg xmlns="http://www.w3.org/2000/svg" width="520" height="234" viewBox="0 0 400 180" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>验证终态宽限的假上游夹具时序</title>
