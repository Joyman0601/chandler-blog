<svg xmlns="http://www.w3.org/2000/svg" width="520" height="463" viewBox="0 0 400 356" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>一份结果从生成到网关确认要经过的状态</title>
  <path d="M14 26V82" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 90V146" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <path d="M14 154V228" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <circle cx="14" cy="22" r="4" fill="#191919"/>
  <text x="30" y="28" font-size="17" font-weight="300" fill="#191919">等生成</text>
  <text x="30" y="52" font-size="13" fill="#626262">上游还在跑；查询出错就继续查询</text>
  <circle cx="14" cy="86" r="4" fill="#191919"/>
  <text x="30" y="92" font-size="17" font-weight="300" fill="#191919">等存储</text>
  <text x="30" y="116" font-size="13" fill="#626262">拿到结果先登记保留，再转存</text>
  <circle cx="14" cy="150" r="4" fill="#191919"/>
  <text x="30" y="156" font-size="17" font-weight="300" fill="#191919">等确认</text>
  <text x="30" y="180" font-size="13" fill="#626262">已有可交付地址；回报失败或没确认，</text>
  <text x="30" y="198" font-size="13" fill="#626262">留在这一站带同一个地址重报</text>
  <circle cx="14" cy="232" r="4" fill="#191919"/>
  <text x="30" y="238" font-size="17" font-weight="300" fill="#191919">已完成</text>
  <text x="30" y="262" font-size="13" fill="#626262">网关确认应用，这时才释放保留</text>
  <circle cx="14" cy="300" r="4.5" fill="none" stroke="#191919" stroke-width="1.2"/>
  <text x="30" y="306" font-size="17" font-weight="300" fill="#191919">已失效</text>
  <text x="30" y="330" font-size="13" fill="#626262">等存储、等确认时任务被改投；</text>
  <text x="30" y="348" font-size="13" fill="#626262">旧投递只清理自己的那份登记</text>
</svg>
