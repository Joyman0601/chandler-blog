<svg xmlns="http://www.w3.org/2000/svg" width="520" height="442" viewBox="0 0 400 340" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <title>一单请求经过哪几层</title>
  <circle cx="14" cy="18" r="4" fill="#191919"/>
  <text x="30" y="23" font-size="15" font-weight="500" fill="#191919">用户</text>
  <path d="M14 22V56" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <text x="30" y="44" font-size="12.5" fill="#626262">HTTP</text>
  <path d="M14 56V110" stroke="#191919" stroke-width="3" fill="none"/>
  <text x="30" y="76" font-size="17" font-weight="300" fill="#191919">主后端网关</text>
  <text x="392" y="76" font-size="12.5" text-anchor="end" fill="#626262">在跑的程序</text>
  <text x="30" y="100" font-size="13" fill="#626262">路由、计费、决定换不换渠道</text>
  <path d="M14 110V144" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <text x="30" y="132" font-size="12.5" fill="#626262">消息队列</text>
  <path d="M14 144V198" stroke="#191919" stroke-width="3" fill="none"/>
  <text x="30" y="164" font-size="17" font-weight="300" fill="#191919">任务 worker</text>
  <text x="392" y="164" font-size="12.5" text-anchor="end" fill="#626262">在跑的程序</text>
  <text x="30" y="188" font-size="13" fill="#626262">取任务、调 SDK、轮询结果、回报网关</text>
  <path d="M14 198V232" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <text x="30" y="220" font-size="12.5" fill="#626262">函数调用</text>
  <path d="M14 232V286" stroke="#191919" stroke-width="3" stroke-dasharray="5 4" fill="none"/>
  <text x="30" y="252" font-size="17" font-weight="300" fill="#191919">供应商 SDK</text>
  <text x="392" y="252" font-size="12.5" text-anchor="end" fill="#626262">一段代码，不是程序</text>
  <text x="30" y="276" font-size="13" fill="#626262">编进网关和 worker 里</text>
  <path d="M14 286V320" stroke="#a9a9a6" stroke-width="1" fill="none"/>
  <text x="30" y="308" font-size="12.5" fill="#626262">HTTPS</text>
  <circle cx="14" cy="324" r="4" fill="#191919"/>
  <text x="30" y="329" font-size="15" font-weight="500" fill="#191919">上游</text>
</svg>
